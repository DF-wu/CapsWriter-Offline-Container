[project]
name = "capswriter-offline"
version = "2.5.0a0"
description = "CapsWriter-Offline 离线语音输入工具"
requires-python = ">=3.10,<3.13"

dependencies = [
    # ASR 核心
    "sherpa-onnx",
    "numpy",
    "gguf",
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime; sys_platform != 'win32'",
    "sentencepiece",
    "soundfile",
    "numba",

    # 网络与 API
    "websockets",
    "openai",
    "ollama",
    "httpx",
    "requests",
    "fastapi==0.139.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.32",

    # CLI 与界面
    "rich",
    "typer",
    "colorama",
    "markdown",
    "markdown-it-py",
    "tkhtmlview",

    # 输入与硬件
    "keyboard",
    "pynput",
    "pyclip",
    "sounddevice",
    "watchdog",
    "pystray",
    "Pillow",

    # 数据处理
    "pypinyin",
    "srt",
    "rapidfuzz",
    "pydub",

    # 对齐器分词（日/韩）
    "nagisa",
    "soynlp",

    # Windows
    "pywin32; sys_platform == 'win32'",
    "psutil",
]

[dependency-groups]
build = [
    "pyinstaller",
]

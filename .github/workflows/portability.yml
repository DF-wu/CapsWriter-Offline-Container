name: portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-cli:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.10", "3.12"]
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile portable Python surface
        run: >-
          python -m compileall -q
          start_server.py start_server_universal.py
          core/protocol.py core/server/schema.py
          core/client/shortcut core/client/global_hotkey client/cli
          scripts/check_docs.py scripts/tests/test_desktop_portability.py

      - name: Compile PyInstaller specification
        run: >-
          python -c "from pathlib import Path;
          compile(Path('build.spec').read_text(encoding='utf-8'),
          'build.spec', 'exec')"

      - name: Verify desktop and packaging portability contracts
        run: >-
          python -m unittest -v
          scripts.tests.test_artifact_self_check
          scripts.tests.test_desktop_portability
          scripts.tests.test_shortcut_combinations
          scripts.tests.test_shortcut_capture
          scripts.tests.test_client_settings
          scripts.tests.test_client_settings_runtime
          scripts.tests.test_client_settings_devices
          scripts.tests.test_client_settings_concurrency
          scripts.tests.test_client_autostart
          scripts.tests.test_client_review
          scripts.tests.test_protocol
          scripts.tests.test_requirements
          scripts.tests.test_github_workflows

      - name: Verify dependency-free CLI
        run: python client/cli/scripts/verify.py

      - name: Verify paired portability documentation
        run: >-
          python scripts/check_docs.py
          docs/en/desktop-portability.md
          docs/zh-TW/desktop-portability.md

  windows-package:
    name: Windows ${{ matrix.variant }} package
    strategy:
      fail-fast: false
      matrix:
        variant: [full, client]
    uses: ./.github/workflows/windows-package.yml
    with:
      variant: ${{ matrix.variant }}

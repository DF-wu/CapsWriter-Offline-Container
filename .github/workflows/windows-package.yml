name: windows-package

# Reusable Windows packaging gate shared by portability (every push/PR) and
# release (fork-v* tags). One call builds one variant:
#   full   -> CapsWriter-Offline-windows-x86_64.zip        (server + client)
#   client -> CapsWriter-Offline-Client-windows-x86_64.zip (client only)
on:
  workflow_call:
    inputs:
      variant:
        description: Package variant, full or client
        required: true
        type: string
      ref:
        description: Commit to build; empty builds the caller's commit
        required: false
        type: string
        default: ""
      retention-days:
        description: Days to keep the uploaded package artifact
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  package:
    name: Windows 2022 / Python 3.12 ${{ inputs.variant }} package
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CAPSWRITER_BUILD_VARIANT: ${{ inputs.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve package variant
        shell: pwsh
        run: |
          switch ($env:CAPSWRITER_BUILD_VARIANT) {
            'full' {
              $dist = 'CapsWriter-Offline'
              $archive = 'CapsWriter-Offline-windows-x86_64'
            }
            'client' {
              $dist = 'CapsWriter-Offline-Client'
              $archive = 'CapsWriter-Offline-Client-windows-x86_64'
            }
            default {
              throw "Unsupported package variant: $env:CAPSWRITER_BUILD_VARIANT"
            }
          }
          "CAPSWRITER_DIST_NAME=$dist" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPSWRITER_ARCHIVE_NAME=$archive" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Bootstrap hash-locked Windows build toolchain
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --no-deps
          --requirement requirements/windows-build-bootstrap.lock

      - name: Install hash-locked Windows build dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --no-binary=srt
          --no-build-isolation
          --requirement requirements/windows-build.lock

      - name: Build portable PyInstaller distribution
        run: python -m PyInstaller --clean --noconfirm build.spec

      - name: Relocate and archive outside the checkout
        shell: pwsh
        run: |
          $built = Join-Path $env:GITHUB_WORKSPACE "dist\$env:CAPSWRITER_DIST_NAME"
          if (-not (Test-Path -LiteralPath $built -PathType Container)) {
            throw "PyInstaller output is missing: $built"
          }

          $stage = Join-Path $env:RUNNER_TEMP 'capswriter-package-stage'
          $archive = Join-Path $env:RUNNER_TEMP "$env:CAPSWRITER_ARCHIVE_NAME.zip"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $built -Destination $stage -Recurse

          Push-Location $stage
          try {
            Compress-Archive -Path $env:CAPSWRITER_DIST_NAME -DestinationPath $archive
          } finally {
            Pop-Location
          }
          $sha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $sizeMiB = [math]::Round((Get-Item -LiteralPath $archive).Length / 1MB, 1)
          Write-Host "$env:CAPSWRITER_ARCHIVE_NAME.zip sha256=$sha256 size=${sizeMiB}MiB"
          "CAPSWRITER_WINDOWS_ARCHIVE=$archive" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract, inspect, and smoke the packaged executables
        shell: pwsh
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP 'capswriter-package-extracted'
          Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $env:CAPSWRITER_WINDOWS_ARCHIVE -DestinationPath $extractRoot
          $artifact = Join-Path $extractRoot $env:CAPSWRITER_DIST_NAME

          $required = @(
            'internal', 'core', 'LLM', 'assets', 'docs', 'logs',
            'config_client.py', 'hot.txt', 'hot-rule.txt',
            'readme.md', 'README.zh-TW.md', 'LICENSE', 'start_client.exe',
            'internal\capswriter-package.json'
          )
          $forbidden = @()
          $mutable = @('logs')
          $executables = @('start_client.exe')
          if ($env:CAPSWRITER_BUILD_VARIANT -eq 'full') {
            $required += @('models', 'config_server.py', 'hot-server.txt', 'start_server.exe')
            $mutable += @('models')
            $executables = @('start_server.exe') + $executables
          } else {
            $forbidden = @(
              'start_server.exe', 'config_server.py', 'hot-server.txt', 'models',
              'core\server', 'internal\onnxruntime', 'internal\sherpa_onnx',
              'internal\llvmlite', 'internal\numba'
            )
          }
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $artifact $relative))) {
              throw "Extracted artifact is missing: $relative"
            }
          }
          foreach ($relative in $forbidden) {
            if (Test-Path -LiteralPath (Join-Path $artifact $relative)) {
              throw "Client-only artifact must not contain: $relative"
            }
          }

          $reparsePoints = @(
            Get-ChildItem -LiteralPath $artifact -Force -Recurse |
              Where-Object {
                ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
              }
          )
          if ($reparsePoints.Count -ne 0) {
            throw "Extracted artifact contains reparse points: $($reparsePoints.FullName -join ', ')"
          }
          foreach ($relative in $mutable) {
            $contents = @(Get-ChildItem -LiteralPath (Join-Path $artifact $relative) -Force)
            if ($contents.Count -ne 0) {
              throw "Mutable artifact directory is not empty: $relative"
            }
          }

          function Invoke-Packaged([string] $ExecutableName, [string[]] $Arguments) {
            $label = "$ExecutableName $($Arguments -join ' ')".Trim()
            $stdout = Join-Path $env:RUNNER_TEMP "$ExecutableName.stdout.txt"
            $stderr = Join-Path $env:RUNNER_TEMP "$ExecutableName.stderr.txt"
            $process = Start-Process `
              -FilePath (Join-Path $artifact $ExecutableName) `
              -ArgumentList $Arguments `
              -WorkingDirectory $artifact `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru
            try {
              Wait-Process -Id $process.Id -Timeout 120 -ErrorAction Stop
            } catch {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$label timed out"
            }
            $process.Refresh()
            [pscustomobject]@{
              Label = $label
              ExitCode = $process.ExitCode
              Stdout = if (Test-Path $stdout) { Get-Content -LiteralPath $stdout -Raw } else { '' }
              Stderr = if (Test-Path $stderr) { Get-Content -LiteralPath $stderr -Raw } else { '' }
            }
          }

          function Invoke-ArtifactSelfCheck([string] $ExecutableName) {
            $result = Invoke-Packaged $ExecutableName @('--artifact-self-check')
            $expected = 'CAPSWRITER_ARTIFACT_SELF_CHECK=.*"status":"ok".*"variant":"' +
              $env:CAPSWRITER_BUILD_VARIANT + '"'
            if ($result.ExitCode -ne 0 -or $result.Stdout -notmatch $expected) {
              Write-Host $result.Stdout
              Write-Error $result.Stderr
              throw "$($result.Label) failed (exit $($result.ExitCode))"
            }
            Write-Host $result.Stdout
          }

          foreach ($executable in $executables) {
            Invoke-ArtifactSelfCheck $executable
          }

          # Functional smoke: the frozen client must reach its instance lock and
          # report that no client is running (exit 1) without opening audio.
          $status = Invoke-Packaged 'start_client.exe' @('--status')
          if ($status.ExitCode -ne 1) {
            Write-Host $status.Stdout
            Write-Error $status.Stderr
            throw "$($status.Label) expected exit 1, got $($status.ExitCode)"
          }

          $internalMiB = [math]::Round(
            (Get-ChildItem -LiteralPath (Join-Path $artifact 'internal') -Recurse -File |
              Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "$env:CAPSWRITER_DIST_NAME internal/ = ${internalMiB}MiB"

      - name: Upload portable Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.CAPSWRITER_ARCHIVE_NAME }}
          path: ${{ env.CAPSWRITER_WINDOWS_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}
